[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dinosaw"
version = "0.0.1"
authors = [
  { name="Moritz Pawlowsky", email="moritz.hans.dieter.pawlowsky@stud.uni-giessen.de"},
  { name="Ronan Docherty", email="ronan.docherty18@imperial.ac.uk"},
]
description = "ViT feature upsampling via CNNs"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "torch>=2.0.0",
  "torchvision",
  "torchmetrics>=0.10.3",
  "timm>=1.0.9",
  "pretrainedvitwrapper[models]@git+https://github.com/rmdocherty/PretrainedViTWrapper",
  "dinov3@git+https://github.com/facebookresearch/dinov3",
  "numpy>=1.26.4",
  "scikit-learn>=1.6.1",
  "pillow>=11.2.0",
  "scikit-image>=0.25.2",
  "tensorboard"
  ]

[project.optional-dependencies]
paper = [
  "interactive-seg-backend[cpu,dev]@git+https://github.com/tldr-group/interactive-seg-backend",
  "tifffile>=2025.3.30",
  "matplotlib>=3.10.0",
]


[project.urls]
"Homepage" = "https://github.com/tldr-group/dino-saw"
"Bug Tracker" = "https://github.com/tldr-group/dino-saw/issues"

[tool.setuptools]
packages = ["dinosaw", "dinosaw.wrappers", "dinosaw.datasets"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true          # everything else comes from PyPI

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true         # only packages explicitly pinned to this index